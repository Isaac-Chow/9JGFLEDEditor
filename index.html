<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LED Pattern Designer & CLI Generator</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #eee; margin: 0; padding: 20px; text-align: center; touch-action: manipulation; }
    h1 { color: #90caf9; margin-bottom: 5px; }
    p { color: #aaa; margin-bottom: 25px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; max-width: 800px; margin: 0 auto 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: left; }
    h2 { color: #90caf9; font-size: 18px; margin-top: 0; }
    .palette { display: flex; gap: 8px; flex-wrap: wrap; margin: 15px 0; justify-content: center; }
    .swatch { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 3px solid #444; transition: 0.15s; }
    .swatch.active { border-color: #ffeb3b; transform: scale(1.15); }
    .canvas-container { width: 100%; overflow-x: auto; background: #000; border-radius: 6px; border: 1px solid #444; margin: 15px 0; }
    #paintCanvas { display: block; width: 100%; height: 70px; cursor: crosshair; touch-action: none; }
    .controls { display: flex; gap: 10px; justify-content: center; margin-top: 15px; flex-wrap: wrap; }
    button { padding: 12px 20px; font-size: 15px; font-weight: bold; background: #1976d2; color: #fff; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    button:hover { background: #115293; }
    .undo-btn { background: #d32f2f; }
    .undo-btn:hover { background: #9a0007; }
    .clear-btn { background: #616161; }
    .clear-btn:hover { background: #424242; }
    .output-box { background: #111; padding: 15px; border-radius: 6px; border: 1px solid #333; font-family: monospace; font-size: 16px; color: #69f0ae; word-break: break-all; margin-top: 10px; text-align: center; }
    .copy-hint { font-size: 13px; color: #aaa; margin-top: 8px; text-align: center; }
    .copy-hint a { color: #90caf9; text-decoration: underline; }
  </style>
</head>
<body>

  <h1>LED Pattern Designer</h1>
  <p>Design the pattern here. Just complete a segment of your pattern and it will be copied throughout the strip.</p>

  <div class="card">
    <h2>1. Select Color Swatch</h2>
    <div class="palette" id="paletteContainer"></div>
  </div>

  <div class="card">
    <h2>2. Paint Strip (115 LEDs)</h2>
    <div class="canvas-container">
      <canvas id="paintCanvas"></canvas>
    </div>
    <div class="controls">
      <button class="undo-btn" onclick="undoPaint()">Oops (Undo)</button>
      <button class="clear-btn" onclick="clearAll('w')">Fill All White</button>
      <button class="clear-btn" onclick="clearAll('x')">Clear All (Black)</button>
    </div>
  </div>

  <div class="card">
    <h2>3. Generated Shorthand Command</h2>
    <div class="output-box" id="outputCode">0 yorbw...</div>
    <div class="copy-hint">Copy and add to <a href="https://docs.google.com/document/d/1-UBprw-wmovMeCIGQHMr-zY3Tul_udzG1J20thlEI_8/edit?usp=sharing" target="_blank">this document</a>.</div>
    <div style="text-align: center; margin-top: 15px;">
      <button onclick="copyCommand()">Copy Command to Clipboard</button>
    </div>
  </div>

  <script>
    const colors = {
      r: '#ff0000', o: '#ffa500', y: '#ffff00', g: '#008000', 
      l: '#00ff00', b: '#0000ff', s: '#00bfff', c: '#00ffff', 
      t: '#008b8b', m: '#ff00ff', i: '#ff1493', p: '#800080', 
      w: '#ffffff', x: '#000000'
    };

    let currentColor = 'r';
    let currentData = 'x'.repeat(115);
    let strokeUndoBuffer = null;
    let isDrawing = false;

    // Build palette swatches
    const palContainer = document.getElementById('paletteContainer');
    for (let key in colors) {
      let div = document.createElement('div');
      div.className = 'swatch' + (key === currentColor ? ' active' : '');
      div.style.background = colors[key];
      div.onclick = () => {
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        div.classList.add('active');
        currentColor = key;
      };
      palContainer.appendChild(div);
    }

    // Canvas Setup
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    const numLeds = 115;

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = 70;
      drawStrip();
    }
    window.onresize = resizeCanvas;
    resizeCanvas();

    function drawStrip() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let ledWidth = canvas.width / numLeds;
      
      for (let i = 0; i < numLeds; i++) {
        let char = currentData[i] || 'x';
        ctx.fillStyle = colors[char] || '#000000';
        ctx.fillRect(i * ledWidth, 0, ledWidth + 0.5, canvas.height); // +0.5 prevents thin black lines between LEDs
        
        // Subtle pixel separator line
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.strokeRect(i * ledWidth, 0, ledWidth, canvas.height);
      }
    }

    function getLedIndexFromEvent(e) {
      let rect = canvas.getBoundingClientRect();
      let clientX = e.clientX;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
      }
      let x = clientX - rect.left;
      let ledWidth = canvas.width / numLeds;
      let index = Math.floor(x / ledWidth);
      return Math.max(0, Math.min(numLeds - 1, index));
    }

    // Pointer events handle Mouse, Touch, and Apple Pencil perfectly on a canvas
    canvas.addEventListener('pointerdown', (e) => {
      isDrawing = true;
      strokeUndoBuffer = currentData;
      let idx = getLedIndexFromEvent(e);
      paintPixel(idx);
      e.preventDefault();
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDrawing) return;
      let rect = canvas.getBoundingClientRect();
      if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
        let idx = getLedIndexFromEvent(e);
        paintPixel(idx);
      }
      e.preventDefault();
    });

    window.addEventListener('pointerup', () => {
      isDrawing = false;
    });

    function paintPixel(i) {
      if (currentData[i] === currentColor) return;
      currentData = currentData.substring(0, i) + currentColor + currentData.substring(i + 1);
      drawStrip();
      updateOutput();
    }

    function undoPaint() {
      if (strokeUndoBuffer !== null) {
        currentData = strokeUndoBuffer;
        drawStrip();
        updateOutput();
      } else {
        alert("No recent stroke to undo.");
      }
    }

    function clearAll(char) {
      strokeUndoBuffer = currentData;
      currentData = char.repeat(115);
      drawStrip();
      updateOutput();
    }

    function updateOutput() {
      let cmd = "0 " + currentData;
      document.getElementById('outputCode').innerText = cmd;
    }

    function copyCommand() {
      let text = document.getElementById('outputCode').innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert("Command copied to clipboard!");
      });
    }

    drawStrip();
    updateOutput();
  </script>

</body>
</html>
